name: Build Drive API and deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *" # every hour; change to e.g. "0 */6 * * *" for every 6 hours
  workflow_dispatch: # "Run workflow" button for an instant refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build JSON from Google Drive
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ROOT_FOLDER_ID: ${{ secrets.ROOT_FOLDER_ID }}
        run: node scripts/build-api.mjs

      - name: Add site files
        run: cp index.html app.js .nojekyll dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Build Drive API and deploy to Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC); uploads are rare, use "Run workflow" for an instant refresh
  workflow_dispatch: # "Run workflow" button for an instant refresh

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build JSON from Google Drive
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ROOT_FOLDER_ID: ${{ secrets.ROOT_FOLDER_ID }}
        run: node scripts/build-api.mjs

      - name: Add site files
        run: cp index.html app.js .nojekyll dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub disables scheduled workflows after 60 days without commits. Re-enabling the workflow
  # through the API on each scheduled run resets that timer, so rare uploads don't stop the schedule.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep scheduled runs enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drive JSON Browser</title>
  <style>
    :root {
      --bg: #f6f4ee;
      --panel: #ffffff;
      --text: #1d2a24;
      --muted: #5e6b64;
      --line: #e2ded2;
      --accent: #013d26;
      --gold: #b8913f;
      --code-bg: #0f1f18;
      --code-text: #e8e2cf;
      --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1512;
        --panel: #15201b;
        --text: #e8e6df;
        --muted: #9aa69f;
        --line: #26332d;
        --accent: #d4b46a;
        --gold: #d4b46a;
        --code-bg: #08100c;
        --error: #f2b8b5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 18px; color: var(--accent); }
    main {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    aside, section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      min-width: 0;
    }
    aside h2, .bar h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    aside h2 { padding: 12px 16px; border-bottom: 1px solid var(--line); }
    #folders { list-style: none; margin: 0; padding: 6px; max-height: 70vh; overflow: auto; }
    #folders a {
      display: block;
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    #folders a:hover { background: var(--bg); }
    #folders a.active { background: var(--accent); color: var(--panel); }
    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .bar h2 { flex: 1; color: var(--text); text-transform: none; letter-spacing: 0; font-size: 16px; overflow-wrap: anywhere; }
    button {
      font: inherit;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    button:hover { border-color: var(--gold); }
    #status { padding: 8px 12px; font-size: 13px; color: var(--muted); }
    #status.error { color: var(--error); }
    .endpoint { padding: 0 12px 10px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
    .endpoint a { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #json {
      margin: 0;
      padding: 16px;
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: 0 0 12px 12px;
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 70vh;
      overflow: auto;
    }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
      #folders { max-height: 240px; }
    }
  </style>
</head>
<body>
  <header><h1>Drive JSON Browser</h1></header>
  <main>
    <aside>
      <h2>Folders</h2>
      <ul id="folders"></ul>
    </aside>
    <section>
      <div class="bar">
        <button id="back" hidden>← All folders</button>
        <h2 id="title">Folders</h2>
        <button id="copy">Copy JSON</button>
        <button id="download">Download</button>
      </div>
      <div id="status"></div>
      <div class="endpoint">API: <a id="endpoint" target="_blank" rel="noopener"></a></div>
      <pre id="json"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
